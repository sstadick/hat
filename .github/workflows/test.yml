name: Test
on: [push, pull_request]
jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Pixi
              uses: prefix-dev/setup-pixi@v0.10.1
              with:
                  pixi-version: v0.76.2
                  cache: true
                  locked: true

            - name: Install dependencies and build
              run: |
                  pixi global install \
                      --channel conda-forge \
                      --channel https://conda.modular.com/max \
                      --channel https://repo.prefix.dev/modular-community \
                      --path .

            - name: Run basic test - hat --help
              run: hat --help

            - name: Run basic test - hat test
              run: hat test

            - name: Run basic test - hat build
              run: hat build

            - name: Configure git for testing
              run: |
                  git config --global user.email "ci@example.com"
                  git config --global user.name "CI Bot"

            - name: Run binary project end-to-end test
              run: |
                  smoke_root="$(mktemp -d)"
                  cd "$smoke_root"
                  hat new --name example
                  cd example
                  hat build
                  hat test
                  ./target/release/example

            - name: Run library project end-to-end test
              run: |
                  smoke_root="$(mktemp -d)"
                  cd "$smoke_root"
                  hat new --lib --name example-lib
                  cd example-lib
                  hat build
                  hat test
                  test -f target/release/example_lib.mojoc
